services:
  app:
    build: .
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - rede

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - rede
    labels:
      traefik.enable: "true"
      traefik.http.routers.condominio.rule: "Host(`condominio.jampasolucoes.com.br`)"
      traefik.http.routers.condominio.entrypoints: "websecure"
      traefik.http.routers.condominio.tls.certresolver: "letsencrypt"
      traefik.http.services.condominio.loadbalancer.server.port: "80"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-condominio}
      POSTGRES_USER: ${DB_USERNAME:-condominio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - condominio-db:/var/lib/postgresql/data
    networks:
      - rede

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - condominio-redis:/data
    networks:
      - rede

volumes:
  condominio-db:
  condominio-redis:

networks:
  rede:
    external: true
